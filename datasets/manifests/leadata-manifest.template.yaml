dataset_name: LeaData
dataset_version: external_leadata_v0.1.0
source_type: public_external
source_url: ""  # FILL IN: URL where dataset was downloaded
source_license: ""  # FILL IN: e.g., CC BY 4.0
source_citation: ""  # FILL IN: BibTeX or reference
commercial_use_allowed: false  # Review license before changing
local_path: datasets/external/leadata
label_schema:
