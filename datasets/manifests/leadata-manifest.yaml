# LeaData V1 Manifest — real local dataset
#
# See docs/datasets/leadata.md for details.

dataset_name: LeaData
dataset_version: external_leadata_v0.1.0
source_type: public_external
source_url: "https://doi.org/10.1038/s41598-025-88040-1"
source_license: "CC BY 4.0 (verify at source)"
source_citation: >
  LeaData: A Comprehensive Dataset for Microscopic Identification of Leather.
  Scientific Reports, 2025. DOI: 10.1038/s41598-025-88040-1.
commercial_use_allowed: false
local_path: datasets/external/LeaData-V1
label_schema:
  primary_label: species
  secondary_labels:
    - sample_group
splits:
  strategy: deterministic_by_sample
  train: 0.6
  validation: 0.2
  test: 0.2
notes: >
  LeaData V1: 1200 microscopic leather texture images (4 species × 300).
  Species: Buffalo, Cow, Goat, Sheep. Structure: {Species}/{SamplePrefix} ({index}).jpg.
  Used for leather-grain pipeline and embedding validation, not luxury authentication.
