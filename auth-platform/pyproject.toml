[project]
name = "auth-platform"
version = "0.1.0"
description = "AI-assisted luxury product authentication platform"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.32.0",
    "sqlalchemy[asyncio]>=2.0.36",
    "asyncpg>=0.30.0",
    "pydantic>=2.10.0",
    "pydantic-settings>=2.6.0",
    "boto3>=1.35.0",
    "httpx>=0.28.0",
    "python-multipart>=0.0.9",
    "structlog>=24.0,<25.0",
    "pgvector>=0.3,<1.0",
    "Pillow>=10.0,<12.0",
    "numpy>=1.26,<3.0",
    "opencv-python-headless>=4.8,<5.0",
    "PyYAML>=6.0,<7.0",
    "psycopg2-binary>=2.9,<3.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3.0",
    "pytest-asyncio>=0.24.0",
    "ruff>=0.8.0",
]

[tool.ruff]
target-version = "py312"
line-length = 120
src = ["services", "libs"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP", "B", "A", "SIM"]
ignore = ["E501"]

[tool.ruff.lint.per-file-ignores]
"services/*/app/routes.py" = ["B008"]
"services/*/app/data_routes.py" = ["B008"]
"ml/metric_learning/{losses,model}.py" = ["N812"]
# K is ML convention for K-shot; appears as JSON output keys and column headers.
"scripts/{run_few_shot_experiment,compare_few_shot_experiments}.py" = ["N802", "N803", "N806"]

[tool.ruff.lint.isort]
known-first-party = ["libs"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["services", "libs", "tests"]
python_files = ["test_*.py"]
python_functions = ["test_*"]
filterwarnings = ["ignore::DeprecationWarning"]
addopts = "--import-mode=importlib"
