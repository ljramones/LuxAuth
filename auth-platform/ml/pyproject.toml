[project]
name = "metric-learning"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "torch>=2.0",
    "torchvision>=0.15",
    "numpy>=1.26",
    "Pillow>=10.0",
    "psycopg2-binary>=2.9",
    "boto3>=1.34",
]

[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"
