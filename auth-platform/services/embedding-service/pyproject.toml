[project]
name = "embedding-service"
version = "0.1.0"
description = "Embedding generation service for the luxury authentication pipeline"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.32.0",
    "sqlalchemy[asyncio]>=2.0.36",
    "asyncpg>=0.30.0",
    "pydantic-settings>=2.6.0",
    "httpx>=0.27.0",
    "opencv-python-headless>=4.8",
    "numpy>=1.26",
    "Pillow>=10.0",
    "torch>=2.0",
    "transformers>=4.45,<5",
    "safetensors>=0.4",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3.0",
    "pytest-asyncio>=0.24.0",
    "httpx>=0.27.0",
]

[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"